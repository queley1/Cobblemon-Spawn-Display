plugins {
	id "fabric-loom"
}

version = project.spawn_display_version
group = project.spawn_display_maven_group

base {
	archivesName = "${project.release_prefix}-${project.name}-mc${project.minecraft_version}"
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "v${project.version}"
}

repositories {
	// Loom supplies the Minecraft and Fabric repositories.
}

def compileOnlyJar = { String propertyName, String environmentName, String fallbackPath ->
	def path = providers.gradleProperty(propertyName)
		.orElse(providers.environmentVariable(environmentName))
		.getOrElse(fallbackPath)
	files(path)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly compileOnlyJar("cobblemon_jar", "COBBLEMON_JAR", "libs/Cobblemon.jar")
	modCompileOnly compileOnlyJar("modmenu_jar", "MODMENU_JAR", "libs/modmenu.jar")
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 21
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

def archiveName = project.base.archivesName.get()

jar {
	from("LICENSE") {
		rename { "${it}_${archiveName}" }
	}
}
